<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Photobooth Strip</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2ead9;
    --ink:#1c1a18;
    --pop:#e8447a;
    --sun:#f0b429;
    --sage:#8fae72;
    --sky:#bcd7e0;
    --film:#181614;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:#d9d2c2;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
    font-family:'Space Mono', monospace;
    color:var(--ink);
  }

  /* ===== STORY FRAME 9:16 ===== */
  .story{
    position:relative;
    width:320px;
    aspect-ratio:9/16;
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,0.06) 1px, transparent 0);
    background-size:12px 12px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    display:flex;
  }

  /* LEFT: text + placeholder scenery peeking behind */
  .left-col{
    width:44%;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:16px 10px;
    border-right:3px dashed rgba(0,0,0,0.15);
  }

  .title{
    font-family:'Caveat', cursive;
    font-size:34px;
    line-height:0.85;
    color:var(--ink);
    transform:rotate(-3deg);
    margin:0 0 10px 2px;
  }

  .recipient-name{
    font-family:'Caveat', cursive;
    font-size:20px;
    font-weight:700;
    color:var(--pop);
    margin:-6px 0 8px 2px;
    line-height:1;
  }

  .msg{
    font-size:10.5px;
    line-height:1.55;
    color:#4a453e;
    margin:0 0 auto 0;
  }
  .msg .heart{color:var(--pop);}

  /* scenery placeholder fills remaining left space */
  .scenery{
    position:relative;
    margin-top:10px;
    flex:1;
    border-radius:8px;
    overflow:hidden;
    background:var(--sky);
  }
  .scenery .cloud{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:0.9;
  }
  .scenery .hill{
    position:absolute;
    left:-10%;
    width:120%;
    background:var(--sage);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .scenery .hill.h1{bottom:0;height:34%;background:#7a9d5f;}
  .scenery .hill.h2{bottom:0;height:20%;background:#9ec176;}

  .swap-note{
    font-size:8px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#b5ab98;
    text-align:center;
    margin-top:8px;
  }

  /* RIGHT: vertical stacked photos, full height */
  .right-col{
    width:56%;
    display:flex;
    flex-direction:column;
    gap:3px;
    padding:3px;
    background:var(--film);
  }

  .ph{
    position:relative;
    flex:1;
    overflow:hidden;
    border-radius:2px;
  }
  .ph img,
  .ph .fill{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .ph .fill{background-size:cover;background-position:center;}

  .ph .tag{
    position:absolute;
    bottom:5px;
    right:6px;
    font-size:8px;
    color:rgba(255,255,255,0.75);
    background:rgba(0,0,0,0.35);
    padding:2px 5px;
    border-radius:10px;
    letter-spacing:0.04em;
  }

  .ph .num{
    position:absolute;
    top:6px;
    left:7px;
    font-family:'Caveat', cursive;
    font-size:16px;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }

  /* slide-in reveal so the strip feels alive */
  .ph .fill{
    transform:translateX(30%);
    opacity:0;
    animation:slideIn 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .right-col .ph:nth-child(1) .fill{animation-delay:.1s;}
  .right-col .ph:nth-child(2) .fill{animation-delay:.3s;}
  .right-col .ph:nth-child(3) .fill{animation-delay:.5s;}
  .right-col .ph:nth-child(4) .fill{animation-delay:.7s;}

  @keyframes slideIn{
    to{transform:translateX(0);opacity:1;}
  }

  @media (prefers-reduced-motion: reduce){
    .ph .fill{animation:none;transform:none;opacity:1;}
  }

  .caption{
    margin-top:18px;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#6b6459;
    text-align:center;
  }
</style>
</head>
<body>

<div>
  <div class="story">

    <div class="left-col">
      <h1 class="title">Birthaay!</h1>
      <p class="recipient-name" id="recipientName">for you</p>
      <p class="msg" id="customMessage">Wishing you a day filled with joy, laughter, and unforgettable memories. I love you <span class="heart">♥</span></p>

      <div class="scenery">
        <div class="cloud" style="width:26px;height:11px;top:12px;left:14px;"></div>
        <div class="cloud" style="width:18px;height:8px;top:26px;right:10px;"></div>
        <div class="hill h2"></div>
        <div class="hill h1"></div>
      </div>
      <div class="swap-note">cutout goes here</div>
    </div>

    <div class="right-col">
      <div class="ph" data-slot="1">
        <div class="fill" id="fill1" style="background:linear-gradient(135deg,#f7d9c4,#e8447a55);"></div>
        <span class="num">01</span>
        <span class="tag" id="tag1">replace me</span>
      </div>
      <div class="ph" data-slot="2">
        <div class="fill" id="fill2" style="background:linear-gradient(135deg,#d7cbb8,#8fae7266);"></div>
        <span class="num">02</span>
        <span class="tag" id="tag2">replace me</span>
      </div>
      <div class="ph" data-slot="3">
        <div class="fill" id="fill3" style="background:linear-gradient(135deg,#f0b42999,#181614);"></div>
        <span class="num">03</span>
        <span class="tag" id="tag3">replace me</span>
      </div>
      <div class="ph" data-slot="4">
        <div class="fill" id="fill4" style="background:linear-gradient(135deg,#e8447a44,#f0b42944);"></div>
        <span class="num">04</span>
        <span class="tag" id="tag4">replace me</span>
      </div>
    </div>

  </div>
  <div class="caption">Instagram Story · Photobooth Strip</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  // Same Firebase project as the main Sorav Temps site — this template just
  // reads the "cards" document that the main site created when the sender
  // generated their link (?id=...).
  const firebaseConfig = {
    apiKey: "AIzaSyCRAO7UDddkFKvKbGGBBtkruD22NZnNozU",
    authDomain: "soravtemps-d5419.firebaseapp.com",
    projectId: "soravtemps-d5419",
    storageBucket: "soravtemps-d5419.firebasestorage.app",
    messagingSenderId: "889624784593",
    appId: "1:889624784593:web:3a325467962639facedff0"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  function setPhoto(slot, url) {
    const fill = document.getElementById(`fill${slot}`);
    const tag = document.getElementById(`tag${slot}`);
    if (!fill || !url) return;
    fill.style.background = 'none';
    const img = document.createElement('img');
    img.src = url;
    img.alt = `Photo ${slot}`;
    fill.appendChild(img);
    if (tag) tag.remove();
  }

  async function loadCard() {
    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('id');
    if (!cardId) return; // no id — keep the default demo card as-is

    try {
      const snap = await getDoc(doc(db, "cards", cardId));
      if (!snap.exists()) return;

      const data = snap.data();

      if (data.name) {
        document.getElementById('recipientName').textContent = `for ${data.name}`;
      }
      if (data.message) {
        document.getElementById('customMessage').textContent = data.message;
      }
      (data.photoUrls || []).forEach((url, i) => setPhoto(i + 1, url));
    } catch (err) {
      console.error('Could not load card data:', err);
    }
  }

  loadCard();
</script>

</body>
</html>
