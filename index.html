<style>
  :root{
    --paper:#f2ead9;
    --ink:#1c1a18;
    --pop:#e8447a;
    --sun:#f0b429;
    --sage:#8fae72;
    --sky:#bcd7e0;
    --film:#181614;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:#d9d2c2;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
    font-family:'Space Mono', monospace;
    color:var(--ink);
  }

  /* ===== STORY FRAME 9:16 ===== */
  .story{
    position:relative;
    width:320px;
    aspect-ratio:9/16;
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,0.06) 1px, transparent 0);
    background-size:12px 12px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    display:flex;
  }

  /* LEFT: text + placeholder scenery peeking behind */
  .left-col{
    width:44%;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:16px 10px;
    border-right:3px dashed rgba(0,0,0,0.15);
  }

  .title{
    font-family:'Caveat', cursive;
    font-size:34px;
    line-height:0.85;
    color:var(--ink);
    transform:rotate(-3deg);
    margin:0 0 10px 2px;
  }

  .recipient-name{
    font-family:'Caveat', cursive;
    font-size:20px;
    font-weight:700;
    color:var(--pop);
    margin:-6px 0 8px 2px;
    line-height:1;
  }

  .msg{
    font-size:10.5px;
    line-height:1.55;
    color:#4a453e;
    margin:0 0 auto 0;
  }
  .msg .heart{color:var(--pop);}

  /* Spotlight stage for the cutout photo — plain, neutral backdrop so a
     background-removed photo of any subject/colour sits naturally on it,
     instead of a fixed illustrated scene it had to visually "match". */
  .scenery{
    position:relative;
    margin-top:10px;
    flex:1;
    border-radius:8px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 34%, rgba(232,68,122,0.16), rgba(240,180,41,0.10) 55%, transparent 78%),
      var(--paper);
    border:2px dashed rgba(0,0,0,0.12);
  }

  /* soft grounding shadow so the cutout doesn't look like it's floating */
  .scenery .floor-shadow{
    position:absolute;
    left:50%;
    bottom:9%;
    width:56%;
    height:10px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.24), transparent 72%);
    border-radius:50%;
    z-index:1;
  }

  /* shown until a cutout photo is loaded in */
  .scenery .placeholder-hint{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 12px;
    font-size:9px;
    line-height:1.6;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#b5ab98;
  }
  .scenery .placeholder-hint .icon{
    font-size:22px;
    line-height:1;
    margin-bottom:6px;
  }

  /* cutout photo (background-removed) sits on the spotlight stage */
  .scenery .cutout-photo{
    position:absolute;
    bottom:2%;
    left:50%;
    transform:translateX(-50%);
    height:98%;
    width:auto;
    max-width:96%;
    object-fit:contain;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    z-index:3;
    display:none;
  }

  /* RIGHT: vertical stacked photos, full height */
  .right-col{
    width:56%;
    display:flex;
    flex-direction:column;
    gap:3px;
    padding:3px;
    background:var(--film);
  }

  .ph{
    position:relative;
    flex:1;
    overflow:hidden;
    border-radius:2px;
  }
  .ph img,
  .ph .fill{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .ph .fill{background-size:cover;background-position:center;}

  .ph .tag{
    position:absolute;
    bottom:5px;
    right:6px;
    font-size:8px;
    color:rgba(255,255,255,0.75);
    background:rgba(0,0,0,0.35);
    padding:2px 5px;
    border-radius:10px;
    letter-spacing:0.04em;
  }

  .ph .num{
    position:absolute;
    top:6px;
    left:7px;
    font-family:'Caveat', cursive;
    font-size:16px;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }

  /* slide-in reveal so the strip feels alive */
  .ph .fill{
    transform:translateX(30%);
    opacity:0;
    animation:slideIn 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .right-col .ph:nth-child(1) .fill{animation-delay:.1s;}
  .right-col .ph:nth-child(2) .fill{animation-delay:.3s;}
  .right-col .ph:nth-child(3) .fill{animation-delay:.5s;}
  .right-col .ph:nth-child(4) .fill{animation-delay:.7s;}

  @keyframes slideIn{
    to{transform:translateX(0);opacity:1;}
  }

  @media (prefers-reduced-motion: reduce){
    .ph .fill{animation:none;transform:none;opacity:1;}
  }

  .caption{
    margin-top:18px;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#6b6459;
    text-align:center;
  }

<body>

<div>
  <div class="story">

    <div class="left-col">
      <h1 class="title">Birthaay!</h1>
      <p class="recipient-name" id="recipientName">for you</p>
      <p class="msg" id="customMessage">Wishing you a day filled with joy, laughter, and unforgettable memories. I love you <span class="heart">♥</span></p>

      <div class="scenery">
        <div class="floor-shadow"></div>
        <div class="placeholder-hint" id="cutoutHint"><span class="icon">✂️</span>your cutout<br>photo goes here</div>
        <img class="cutout-photo" id="cutoutPhoto" alt="">
      </div>
    </div>

    <div class="right-col">
      <div class="ph" data-slot="1">
        <div class="fill" id="fill1" style="background:linear-gradient(135deg,#f7d9c4,#e8447a55);"></div>
        <span class="num">01</span>
        <span class="tag" id="tag1">replace me</span>
      </div>
      <div class="ph" data-slot="2">
        <div class="fill" id="fill2" style="background:linear-gradient(135deg,#d7cbb8,#8fae7266);"></div>
        <span class="num">02</span>
        <span class="tag" id="tag2">replace me</span>
      </div>
      <div class="ph" data-slot="3">
        <div class="fill" id="fill3" style="background:linear-gradient(135deg,#f0b42999,#181614);"></div>
        <span class="num">03</span>
        <span class="tag" id="tag3">replace me</span>
      </div>
      <div class="ph" data-slot="4">
        <div class="fill" id="fill4" style="background:linear-gradient(135deg,#e8447a44,#f0b42944);"></div>
        <span class="num">04</span>
        <span class="tag" id="tag4">replace me</span>
      </div>
    </div>

  </div>
  <div class="caption">Instagram Story · Photobooth Strip</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  // Same Firebase project as the main Sorav Temps site — this template just
  // reads the "cards" document that the main site created when the sender
  // generated their link (?id=...).
  const firebaseConfig = {
    apiKey: "AIzaSyDneahIyDuurQB30uGrM0iC6xkDv71yUjo",
    authDomain: "ditemps.firebaseapp.com",
    projectId: "ditemps",
    storageBucket: "ditemps.firebasestorage.app",
    messagingSenderId: "14858245467",
    appId: "1:14858245467:web:97cdf1133278e001c6367e",
    measurementId: "G-9W89PHQQQ7"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  function setPhoto(slot, url) {
    const fill = document.getElementById(`fill${slot}`);
    const tag = document.getElementById(`tag${slot}`);
    if (!fill || !url) return;
    fill.style.background = 'none';
    const img = document.createElement('img');
    img.src = url;
    img.alt = `Photo ${slot}`;
    fill.appendChild(img);
    if (tag) tag.remove();
  }

  // The uploaded cutout PNG often has a lot of empty transparent margin
  // around the person (the background-removal step doesn't crop tight),
  // which makes the subject look small however big the display box is.
  // This loads the image, finds the actual subject's bounding box from
  // its alpha channel, and redraws just that tight crop onto the <img>.
  // Falls back silently to the original URL if the image can't be read
  // (e.g. a CORS-blocked host).
  function trimTransparentEdges(url, paddingPct = 0.04) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const w = img.naturalWidth, h = img.naturalHeight;
          const srcCanvas = document.createElement('canvas');
          srcCanvas.width = w; srcCanvas.height = h;
          const sctx = srcCanvas.getContext('2d');
          sctx.drawImage(img, 0, 0);

          const { data } = sctx.getImageData(0, 0, w, h);
          let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
          for (let y = 0; y < h; y += 1) {
            for (let x = 0; x < w; x += 1) {
              const alpha = data[(y * w + x) * 4 + 3];
              if (alpha > 10) {
                found = true;
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
          if (!found) { resolve(url); return; }

          const boxW = maxX - minX + 1;
          const boxH = maxY - minY + 1;
          const padX = Math.round(boxW * paddingPct);
          const padY = Math.round(boxH * paddingPct);
          const cropX = Math.max(0, minX - padX);
          const cropY = Math.max(0, minY - padY);
          const cropW = Math.min(w, maxX + padX + 1) - cropX;
          const cropH = Math.min(h, maxY + padY + 1) - cropY;

          const outCanvas = document.createElement('canvas');
          outCanvas.width = cropW; outCanvas.height = cropH;
          outCanvas.getContext('2d').drawImage(srcCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
          resolve(outCanvas.toDataURL('image/png'));
        } catch (e) {
          resolve(url); // canvas read blocked (CORS) — just use the original
        }
      };
      img.onerror = () => resolve(url);
      img.src = url;
    });
  }

  async function setCutout(url) {
    const img = document.getElementById('cutoutPhoto');
    const hint = document.getElementById('cutoutHint');
    if (!img || !url) return;
    img.src = await trimTransparentEdges(url);
    img.style.display = 'block';
    if (hint) hint.remove();
  }

  async function loadCard() {
    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('id');
    if (!cardId) return; // no id — keep the default demo card as-is

    try {
      const snap = await getDoc(doc(db, "cards", cardId));
      if (!snap.exists()) return;

      const data = snap.data();

      if (data.name) {
        document.getElementById('recipientName').textContent = `for ${data.name}`;
      }
      if (data.message) {
        document.getElementById('customMessage').textContent = data.message;
      }
      (data.photoUrls || []).forEach((url, i) => setPhoto(i + 1, url));
      if (data.cutout && data.cutout[0]) {
        setCutout(data.cutout[0]);
      }
    } catch (err) {
      console.error('Could not load card data:', err);
    }
  }

  loadCard();
</script>

</body>
